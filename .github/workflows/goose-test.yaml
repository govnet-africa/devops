name: Goose Test

on:
  workflow_call:
    inputs:
      goose-migrations-path:
        description: Path containing goose migrations
        required: true
        type: string

      goose-version-table:
        description: Goose version table
        required: false
        type: string
        default: goose_db_version

      postgres-image:
        description: PostgreSQL image
        required: false
        type: string
        default: postgres:18

      postgres-extensions:
        description: Extensions to install, one per line
        required: false
        type: string
        default: ""

      db-driver:
        description: Goose driver
        required: false
        type: string
        default: postgres

      go-version:
        description: Go version
        required: false
        type: string
        default: "1.25"

jobs:
  goose-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_DB: govnet
          POSTGRES_USER: govnet
          POSTGRES_PASSWORD: govnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U govnet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          
    env:
      DB_DRIVER: ${{ inputs.db-driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: govnet
      DB_USERNAME: govnet
      DB_PASSWORD: govnet

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Install Goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Wait for PostgreSQL
        run: |
          until pg_isready \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USERNAME"
          do
            sleep 2
          done

      - name: Install PostgreSQL Extensions
        if: inputs.postgres-extensions != ''
        env:
          POSTGRES_EXTENSIONS: ${{ inputs.postgres-extensions }}
        run: |
          IFS=',' read -ra EXTENSIONS <<< "$POSTGRES_EXTENSIONS"
          for EXTENSION in "${EXTENSIONS[@]}"; do
            [ -z "$EXTENSION" ] && continue
            psql \
              -h "$DB_HOST" \
              -U "$DB_USERNAME" \
              -d "$DB_DATABASE" \
              -c "CREATE EXTENSION IF NOT EXISTS \"$EXTENSION\";"
          done

      - name: Configure Goose
        run: |
          echo "GOOSE_DRIVER=${DB_DRIVER}" >> $GITHUB_ENV
          echo "GOOSE_DBSTRING=host=${DB_HOST} user=${DB_USERNAME} password=${DB_PASSWORD} dbname=${DB_DATABASE} port=${DB_PORT} sslmode=disable" >> $GITHUB_ENV

      - name: Run Migrations
        run: |
          goose \
            -table "${{ inputs.goose-version-table }}" \
            -dir "${{ inputs.goose-migrations-path }}" \
            up

      - name: Migration Status
        run: |
          goose \
            -table "${{ inputs.goose-version-table }}" \
            -dir "${{ inputs.goose-migrations-path }}" \
            status
